name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build wheel
      - run: python -m build --sdist --wheel --outdir dist
      - name: Repack wheel with 5 build tags
        run: |
          set -eux
          mkdir unpacked
          python -m wheel unpack dist/*.whl -d unpacked
          rm dist/*.whl
          for n in 1 2 3 4 5; do
            python -m wheel pack unpacked/* --build-number "$n" -d dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
