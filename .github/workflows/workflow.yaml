name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build wheel
      - run: python -m build --sdist --wheel --outdir dist
      - name: Repack wheel with build tag
        run: |
          python -m pip install wheel
          python -m wheel unpack dist/*.whl -d unpacked
          python -m wheel pack unpacked/* --build-number 1 -d dist
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
